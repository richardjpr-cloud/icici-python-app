version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 056611633396.dkr.ecr.ap-south-1.amazonaws.com
      - REPOSITORY_URI=056611633396.dkr.ecr.ap-south-1.amazonaws.com/icici-python-app
      - IMAGE_TAG=latest

  build:
    commands:
      - echo Building Docker image
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

  post_build:
    commands:
      - echo Pushing Docker image to Amazon ECR
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Docker image pushed successfully
